<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planning Repas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700&display=swap">

<style>
/* ===== DESIGN TOKENS =====
   Layout: sidebar nav + main weekly grid, sticky header avec semaine nav
   Color: violet/indigo (cohérence TrackCaloriLog), semantic rouge/vert pour quotas
   Type: Syne (headings), Inter (body + data)
*/
:root {
  --bg:          #f8f7ff;
  --surface:     #ffffff;
  --surface-alt: #f1f0fb;
  --border:      #e4e2f5;
  --fg:          #1a1825;
  --fg-muted:    #6b6880;
  --fg-subtle:   #a09db8;
  --accent:      #667eea;
  --accent-dark: #764ba2;
  --accent-bg:   rgba(102,126,234,0.08);
  --ok:          #22c55e;
  --ok-bg:       rgba(34,197,94,0.10);
  --warn:        #f59e0b;
  --warn-bg:     rgba(245,158,11,0.10);
  --danger:      #ef4444;
  --danger-bg:   rgba(239,68,68,0.10);
  --draft-bg:    rgba(102,126,234,0.06);
  --draft-border:#c4b9f0;
  --confirmed-bg:rgba(34,197,94,0.06);
  --confirmed-border:#86efac;
  --radius:      10px;
  --radius-sm:   6px;
  --shadow:      0 1px 4px rgba(102,126,234,0.10), 0 0 0 1px var(--border);
  --shadow-card: 0 2px 12px rgba(102,126,234,0.12);
  --grad: linear-gradient(135deg, #667eea, #764ba2);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #0f0e1a;
    --surface:     #1a1825;
    --surface-alt: #231f35;
    --border:      #2e2a45;
    --fg:          #f0eeff;
    --fg-muted:    #9490b5;
    --fg-subtle:   #5a5675;
    --accent:      #7c8ff5;
    --accent-dark: #a06ed4;
    --accent-bg:   rgba(124,143,245,0.10);
    --ok:          #4ade80;
    --ok-bg:       rgba(74,222,128,0.10);
    --warn:        #fbbf24;
    --warn-bg:     rgba(251,191,36,0.10);
    --danger:      #f87171;
    --danger-bg:   rgba(248,113,113,0.10);
    --draft-bg:    rgba(124,143,245,0.08);
    --draft-border:#4a4680;
    --confirmed-bg:rgba(74,222,128,0.08);
    --confirmed-border:#4ade80;
    --shadow:      0 1px 4px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
    --shadow-card: 0 2px 16px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #0f0e1a;
  --surface:     #1a1825;
  --surface-alt: #231f35;
  --border:      #2e2a45;
  --fg:          #f0eeff;
  --fg-muted:    #9490b5;
  --fg-subtle:   #5a5675;
  --accent:      #7c8ff5;
  --accent-dark: #a06ed4;
  --accent-bg:   rgba(124,143,245,0.10);
  --ok:          #4ade80;
  --ok-bg:       rgba(74,222,128,0.10);
  --warn:        #fbbf24;
  --warn-bg:     rgba(251,191,36,0.10);
  --danger:      #f87171;
  --danger-bg:   rgba(248,113,113,0.10);
  --draft-bg:    rgba(124,143,245,0.08);
  --draft-border:#4a4680;
  --confirmed-bg:rgba(74,222,128,0.08);
  --confirmed-border:#4ade80;
  --shadow:      0 1px 4px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
  --shadow-card: 0 2px 16px rgba(0,0,0,0.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
}

body {
  display: flex;
  flex-direction: column;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* ===== HEADER ===== */
.app-header {
  background: var(--grad);
  padding: 14px max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: #667eea;
  z-index: 21;
}

.app-header .brand {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.brand-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
}
.nav-links {
  display: flex;
  gap: 4px;
  align-items: center;
}
.nav-links a {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  transition: background 0.15s, color 0.15s;
}
.nav-links a:hover { color: #fff; background: rgba(255,255,255,0.12); }
.nav-links a.active { color: #fff; background: rgba(255,255,255,0.2); }

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-icon {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: background 0.15s;
}
.btn-icon:hover { background: rgba(255,255,255,0.25); }

/* ===== MAIN LAYOUT ===== */
.main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== WEEK NAVIGATION ===== */
.week-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.week-label {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  white-space: nowrap;
}
.week-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-week {
  height: 30px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-muted);
  cursor: pointer;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.btn-week:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.btn-week.primary {
  background: var(--grad);
  border-color: transparent;
  color: #fff;
}
.btn-week.primary:hover { opacity: 0.9; }

.week-goals-summary {
  display: flex;
  gap: 16px;
  align-items: center;
}
.goal-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--fg-muted);
}
.goal-chip strong {
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}

/* ===== WEEK GRID ===== */
.week-grid {
  flex: 1;
  overflow: auto;
  padding: 16px max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}

.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  min-width: 700px;
}

/* ===== DAY COLUMN ===== */
.day-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.day-header {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 10px 12px;
  border: 1px solid var(--border);
  position: relative;
}
.day-header.today {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.day-name {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-muted);
}
.day-header.today .day-name { color: var(--accent); }
.day-number {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.day-header.today .day-number { color: var(--accent); }

/* calorie bar */
.day-cals-bar {
  margin-top: 8px;
}
.day-cals-label {
  font-size: 11px;
  color: var(--fg-muted);
  margin-bottom: 3px;
  display: flex;
  justify-content: space-between;
  font-variant-numeric: tabular-nums;
}
.day-cals-label strong { color: var(--fg); }
.progress-bar {
  height: 4px;
  border-radius: 2px;
  background: var(--surface-alt);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--grad);
  transition: width 0.4s ease;
}
.progress-fill.over { background: linear-gradient(90deg, var(--warn), var(--danger)); }

/* protein chip */
.day-protein {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
}
.protein-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
}
.protein-dot.low { background: var(--warn); }
.protein-dot.very-low { background: var(--danger); }

/* ===== MEAL CARDS ===== */
.meal-card {
  border-radius: var(--radius);
  border: 1px solid var(--draft-border);
  background: var(--draft-bg);
  padding: 10px 11px;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s;
  position: relative;
}
.meal-card:hover {
  box-shadow: var(--shadow-card);
  border-color: var(--accent);
}
.meal-card.confirmed {
  border-color: var(--confirmed-border);
  background: var(--confirmed-bg);
}
.meal-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 5px;
}
.meal-type-badge {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 7px;
  border-radius: 20px;
  flex-shrink: 0;
}
.meal-type-badge.breakfast { background: rgba(251,191,36,0.15); color: var(--warn); }
.meal-type-badge.lunch     { background: rgba(102,126,234,0.15); color: var(--accent); }
.meal-type-badge.dinner    { background: rgba(118,75,162,0.15); color: var(--accent-dark); }
.meal-type-badge.snack     { background: rgba(34,197,94,0.15); color: var(--ok); }

.meal-status-icon {
  font-size: 13px;
  flex-shrink: 0;
}

.meal-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
  margin-bottom: 4px;
}
.meal-macros {
  font-size: 11px;
  color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.macro-cal { font-weight: 600; color: var(--accent); }
.macro-prot { color: var(--ok); }

.meal-card-actions {
  display: none;
  gap: 4px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.meal-card:hover .meal-card-actions,
.meal-card.expanded .meal-card-actions {
  display: flex;
}
.btn-action {
  flex: 1;
  height: 26px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-muted);
  cursor: pointer;
  font-size: 11px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.12s;
  white-space: nowrap;
}
.btn-action:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.btn-action.confirm { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.btn-action.confirm:hover { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn-action.del { border-color: transparent; }
.btn-action.del:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }

/* ===== ADD BUTTON ===== */
.btn-add-meal {
  border-radius: var(--radius);
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--fg-subtle);
  cursor: pointer;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  padding: 8px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.15s;
  text-align: center;
}
.btn-add-meal:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-bg);
  border-style: solid;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,8,25,0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal-overlay[hidden] { display: none !important; }
.modal {
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  animation: modal-in 0.2s ease;
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--fg);
}
.modal-body {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ===== FORM ELEMENTS ===== */
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.form-input, .form-select {
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--fg);
  padding: 0 12px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* food items builder */
.food-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.food-row {
  display: grid;
  grid-template-columns: 1fr 80px 28px;
  gap: 6px;
  align-items: center;
}
.food-row input {
  height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--fg);
  padding: 0 10px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.15s;
}
.food-row input:focus { border-color: var(--accent); }
.food-row input.qty { font-variant-numeric: tabular-nums; }
.btn-remove {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--danger-bg);
  color: var(--danger);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 15px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.btn-remove:hover { background: var(--danger); color: #fff; }
.btn-add-food {
  height: 30px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--fg-subtle);
  cursor: pointer;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  align-self: flex-start;
}
.btn-add-food:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); border-style: solid; }

/* preview totals */
.preview-totals {
  background: var(--surface-alt);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: center;
}
.preview-stat { display: flex; flex-direction: column; gap: 2px; }
.preview-stat-val {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.preview-stat-val.prot { color: var(--ok); }
.preview-stat-lbl {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-subtle);
}

/* modal buttons */
.btn-primary {
  height: 36px;
  padding: 0 18px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--grad);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.9; }
.btn-cancel {
  height: 36px;
  padding: 0 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg-muted);
  cursor: pointer;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--fg-muted); color: var(--fg); }

/* ===== TOAST ===== */
.toast-container {
  position: fixed;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--fg);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  animation: toast-in 0.25s ease;
  pointer-events: auto;
}
.toast.ok   { background: var(--ok); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== EMPTY STATE ===== */
.empty-day {
  font-size: 11px;
  color: var(--fg-subtle);
  text-align: center;
  padding: 6px 0 2px;
}

/* ===== LOADING ===== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
.loading-overlay[hidden] { display: none !important; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  .week-goals-summary { display: none; }
  .days-grid { grid-template-columns: repeat(4, minmax(140px, 1fr)); }
}
@media (max-width: 480px) {
  .nav-links { display: none; }
  .days-grid { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
}

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ===== CONFIG =====
const API_URL = 'https://trackcalorilog-back.onrender.com';
const DAILY_CAL_GOAL  = 2200;
const DAILY_PROT_GOAL = 160;

// ===== STATE =====
let token = null;
let currentWeekStart = getMonday(new Date());
let drafts = []; // { _id, title, type, plannedDate, totals, items, isDraft, confirmedAt }
let editingId = null;

// ===== UTILS =====
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

function formatDate(d) {
  return d.toISOString().split('T')[0];
}

function isSameDay(a, b) {
  return formatDate(new Date(a)) === formatDate(new Date(b));
}

const DAY_NAMES = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const MONTH_NAMES = ['jan.','fév.','mar.','avr.','mai','jui.','juil.','aoû.','sep.','oct.','nov.','déc.'];

function weekLabel(start) {
  const end = addDays(start, 6);
  const s = start, e = end;
  if (s.getMonth() === e.getMonth()) {
    return `${s.getDate()} – ${e.getDate()} ${MONTH_NAMES[s.getMonth()]} ${s.getFullYear()}`;
  }
  return `${s.getDate()} ${MONTH_NAMES[s.getMonth()]} – ${e.getDate()} ${MONTH_NAMES[e.getMonth()]} ${e.getFullYear()}`;
}

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

// ===== AUTH =====
function checkAuth() {
  token = localStorage.getItem('token') || sessionStorage.getItem('token');
  if (!token) {
    document.getElementById('authOverlay').hidden = false;
    document.getElementById('loadingOverlay').hidden = true;
    return false;
  }
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    const name = payload.name || payload.email || '';
    document.getElementById('userChip').textContent = name;
  } catch(e) {}
  return true;
}

document.getElementById('btnLogout').addEventListener('click', () => {
  localStorage.removeItem('token');
  sessionStorage.removeItem('token');
  window.location.href = '/login.html';
});

// ===== API =====
async function fetchDrafts(weekStart) {
  const resp = await fetch(`${API_URL}/api/nutrition/meals/drafts?weekStart=${formatDate(weekStart)}`, {
    headers: authHeaders()
  });
  if (!resp.ok) throw new Error('Erreur chargement drafts');
  return resp.json();
}

async function createDraft(data) {
  const resp = await fetch(`${API_URL}/api/nutrition/meals/drafts`, {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(data)
  });
  if (!resp.ok) throw new Error('Erreur création brouillon');
  return resp.json();
}

async function updateDraft(id, data) {
  const resp = await fetch(`${API_URL}/api/nutrition/meals/drafts/${id}`, {
    method: 'PUT',
    headers: authHeaders(),
    body: JSON.stringify(data)
  });
  if (!resp.ok) throw new Error('Erreur modification brouillon');
  return resp.json();
}

async function confirmDraft(id) {
  const resp = await fetch(`${API_URL}/api/nutrition/meals/drafts/${id}/confirm`, {
    method: 'PATCH',
    headers: authHeaders()
  });
  if (!resp.ok) throw new Error('Erreur confirmation');
  return resp.json();
}

async function deleteDraft(id) {
  const resp = await fetch(`${API_URL}/api/nutrition/meals/${id}`, {
    method: 'DELETE',
    headers: authHeaders()
  });
  if (!resp.ok) throw new Error('Erreur suppression');
  return resp.json();
}

// ===== RENDER =====
function renderWeek() {
  document.getElementById('weekLabel').textContent = weekLabel(currentWeekStart);

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  const today = new Date();
  let totalCals = 0, totalProt = 0, draftCnt = 0;

  for (let i = 0; i < 7; i++) {
    const day = addDays(currentWeekStart, i);
    const dayStr = formatDate(day);
    const isToday = isSameDay(day, today);

    const dayDrafts = drafts.filter(d => {
      const pd = d.plannedDate || d.date;
      return isSameDay(pd, day);
    });

    // Day column
    const col = document.createElement('div');
    col.className = 'day-col';

    // Day totals
    const dayCals  = dayDrafts.reduce((s, d) => s + (d.totals?.calories  || 0), 0);
    const dayProt  = dayDrafts.reduce((s, d) => s + (d.totals?.proteins  || 0), 0);
    totalCals += dayCals;
    totalProt += dayProt;
    draftCnt  += dayDrafts.filter(d => d.isDraft).length;

    const pct = Math.min(Math.round(dayCals / DAILY_CAL_GOAL * 100), 120);
    const protOk = dayProt >= DAILY_PROT_GOAL * 0.85;
    const protLow = dayProt > 0 && dayProt < DAILY_PROT_GOAL * 0.5;

    // Header
    const header = document.createElement('div');
    header.className = 'day-header' + (isToday ? ' today' : '');
    header.innerHTML = `
      <div class="day-name">${DAY_NAMES[i]}</div>
      <div class="day-number">${day.getDate()}</div>
      ${dayDrafts.length > 0 ? `
        <div class="day-cals-bar">
          <div class="day-cals-label">
            <span><strong>${Math.round(dayCals)}</strong> kcal</span>
            <span style="color:var(--fg-subtle)">${DAILY_CAL_GOAL}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill${pct > 105 ? ' over' : ''}" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="day-protein">
          <div class="protein-dot${protOk ? '' : protLow ? ' very-low' : ' low'}"></div>
          <span>${Math.round(dayProt)}g prot.</span>
        </div>
      ` : ''}
    `;
    col.appendChild(header);

    // Meal cards
    if (dayDrafts.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.textContent = 'Aucun repas prévu';
      col.appendChild(empty);
    } else {
      dayDrafts.forEach(draft => {
        const card = document.createElement('div');
        card.className = 'meal-card' + (draft.isDraft === false ? ' confirmed' : '');
        card.dataset.id = draft._id;

        const statusIcon = draft.isDraft === false ? '✅' : '📋';
        const typeLabels = { breakfast:'Matin', lunch:'Midi', dinner:'Soir', snack:'Snack' };

        card.innerHTML = `
          <div class="meal-card-top">
            <span class="meal-type-badge ${draft.type}">${typeLabels[draft.type] || draft.type}</span>
            <span class="meal-status-icon">${statusIcon}</span>
          </div>
          <div class="meal-title">${draft.title || 'Repas sans titre'}</div>
          <div class="meal-macros">
            <span class="macro-cal">${Math.round(draft.totals?.calories || 0)} kcal</span>
            <span class="macro-prot">${Math.round(draft.totals?.proteins || 0)}g prot</span>
            ${draft.totals?.carbs ? `<span>${Math.round(draft.totals.carbs)}g gluc</span>` : ''}
          </div>
          <div class="meal-card-actions">
            ${draft.isDraft !== false ? `<button class="btn-action confirm" data-action="confirm" data-id="${draft._id}">✓ Confirmer</button>` : ''}
            <button class="btn-action" data-action="edit" data-id="${draft._id}">✎ Modifier</button>
            <button class="btn-action del" data-action="delete" data-id="${draft._id}">✕</button>
          </div>
        `;

        card.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action]');
          if (btn) {
            e.stopPropagation();
            handleCardAction(btn.dataset.action, btn.dataset.id);
          } else {
            card.classList.toggle('expanded');
          }
        });

        col.appendChild(card);
      });
    }

    // Add button
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add-meal';
    addBtn.dataset.date = dayStr;
    addBtn.innerHTML = '+ Planifier';
    addBtn.addEventListener('click', () => openModal(null, dayStr));
    col.appendChild(addBtn);

    grid.appendChild(col);
  }

  // Update summary
  const nonEmpty = Array.from({length:7}, (_,i) => addDays(currentWeekStart, i))
    .filter(d => drafts.some(dr => isSameDay(dr.plannedDate || dr.date, d))).length || 1;

  document.getElementById('avgCals').textContent = Math.round(totalCals / nonEmpty);
  document.getElementById('avgProt').textContent = Math.round(totalProt / nonEmpty);
  document.getElementById('draftCount').textContent = draftCnt;
  document.getElementById('weekSummary').hidden = drafts.length === 0;
}

// ===== CARD ACTIONS =====
async function handleCardAction(action, id) {
  if (action === 'confirm') {
    if (!confirm('Confirmer ce repas dans ton historique ?')) return;
    try {
      await confirmDraft(id);
      toast('Repas confirmé et ajouté à l\'historique 🎉', 'ok');
      await loadWeek();
    } catch(e) { toast('Erreur : ' + e.message, 'warn'); }
  }
  if (action === 'edit') {
    const draft = drafts.find(d => d._id === id);
    if (draft) openModal(draft);
  }
  if (action === 'delete') {
    if (!confirm('Supprimer ce brouillon ?')) return;
    try {
      await deleteDraft(id);
      toast('Brouillon supprimé');
      await loadWeek();
    } catch(e) { toast('Erreur : ' + e.message, 'warn'); }
  }
}

// ===== MODAL =====
let foodRows = [];

function openModal(draft, presetDate) {
  editingId = draft?._id || null;
  document.getElementById('modalTitle').textContent = editingId ? 'Modifier le brouillon' : 'Planifier un repas';
  document.getElementById('btnSaveDraft').textContent = editingId ? 'Enregistrer' : 'Créer le brouillon';

  // Fill form
  const today = formatDate(new Date());
  document.getElementById('inputDate').value = draft ? formatDate(new Date(draft.plannedDate || draft.date)) : (presetDate || today);
  document.getElementById('inputType').value = draft?.type || 'lunch';
  document.getElementById('inputTitle').value = draft?.title || '';

  foodRows = draft?.items?.length ? draft.items.map(i => ({ name: i.name || '', qty: i.quantity || 100 }))
                                  : [{ name: '', qty: 100 }];
  renderFoodRows();
  updatePreview();

  document.getElementById('draftModal').hidden = false;
  document.getElementById('inputTitle').focus();
}

function closeModal() {
  document.getElementById('draftModal').hidden = true;
  editingId = null;
  foodRows = [];
}

document.getElementById('btnCloseModal').addEventListener('click', closeModal);
document.getElementById('btnCancelModal').addEventListener('click', closeModal);
document.getElementById('draftModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('draftModal')) closeModal();
});

function renderFoodRows() {
  const list = document.getElementById('foodList');
  list.innerHTML = '';
  foodRows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'food-row';
    div.innerHTML = `
      <input type="text" placeholder="Nom de l'aliment" value="${escHtml(row.name)}" data-idx="${i}" data-field="name">
      <input type="number" class="qty" placeholder="g" value="${row.qty}" min="0" data-idx="${i}" data-field="qty">
      <button class="btn-remove" data-idx="${i}" title="Supprimer">×</button>
    `;
    div.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = +e.target.dataset.idx;
        const field = e.target.dataset.field;
        foodRows[idx][field] = field === 'qty' ? +e.target.value : e.target.value;
        updatePreview();
      });
    });
    div.querySelector('.btn-remove').addEventListener('click', (e) => {
      const idx = +e.currentTarget.dataset.idx;
      foodRows.splice(idx, 1);
      renderFoodRows();
      updatePreview();
    });
    list.appendChild(div);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('btnAddFoodRow').addEventListener('click', () => {
  foodRows.push({ name: '', qty: 100 });
  renderFoodRows();
  updatePreview();
});

// Simple estimation: 2 kcal/g, 0.1g prot/g, 0.2g carb/g, 0.05g fat/g
// (used only for demo / items without backend nutritional data)
function estimateMacros(name, qty) {
  const n = (name || '').toLowerCase();
  // Very rough per-100g estimates for common foods
  const db = {
    poulet: { cal: 165, prot: 31, carb: 0,  fat: 3.6 },
    riz:    { cal: 130, prot: 2.7,carb: 28,  fat: 0.3 },
    pâtes:  { cal: 158, prot: 5.8,carb: 31,  fat: 0.9 },
    oeufs:  { cal: 155, prot: 13, carb: 1.1, fat: 11  },
    oeuf:   { cal: 155, prot: 13, carb: 1.1, fat: 11  },
    saumon: { cal: 208, prot: 20, carb: 0,   fat: 13  },
    thon:   { cal: 144, prot: 30, carb: 0,   fat: 1   },
    boeuf:  { cal: 250, prot: 26, carb: 0,   fat: 15  },
    brocoli:{ cal: 34,  prot: 2.8,carb: 7,   fat: 0.4 },
    lentilles:{ cal: 116, prot: 9, carb: 20, fat: 0.4 },
    pain:   { cal: 265, prot: 9,  carb: 49,  fat: 3   },
    fromage:{ cal: 402, prot: 25, carb: 1.3, fat: 33  },
    yaourt: { cal: 59,  prot: 3.5,carb: 4,   fat: 3.3 },
    banane: { cal: 89,  prot: 1.1,carb: 23,  fat: 0.3 },
    pomme:  { cal: 52,  prot: 0.3,carb: 14,  fat: 0.2 },
    lait:   { cal: 42,  prot: 3.4,carb: 5,   fat: 1   },
  };
  const match = Object.keys(db).find(k => n.includes(k));
  const base = match ? db[match] : { cal: 120, prot: 5, carb: 15, fat: 4 };
  const factor = qty / 100;
  return {
    calories: Math.round(base.cal  * factor),
    proteins: Math.round(base.prot * factor * 10) / 10,
    carbs:    Math.round(base.carb * factor * 10) / 10,
    fats:     Math.round(base.fat  * factor * 10) / 10,
  };
}

function updatePreview() {
  let cal = 0, prot = 0, carb = 0, fat = 0;
  foodRows.forEach(r => {
    if (!r.name) return;
    const m = estimateMacros(r.name, r.qty || 100);
    cal  += m.calories;
    prot += m.proteins;
    carb += m.carbs;
    fat  += m.fats;
  });
  document.getElementById('prevCal').textContent  = Math.round(cal);
  document.getElementById('prevProt').textContent = Math.round(prot) + 'g';
  document.getElementById('prevCarb').textContent = Math.round(carb) + 'g';
  document.getElementById('prevFat').textContent  = Math.round(fat) + 'g';
}

// ===== SAVE DRAFT =====
document.getElementById('btnSaveDraft').addEventListener('click', async () => {
  const date    = document.getElementById('inputDate').value;
  const type    = document.getElementById('inputType').value;
  const title   = document.getElementById('inputTitle').value.trim();

  if (!date)  { toast('Choisis une date', 'warn'); return; }
  if (!title) { toast('Donne un nom au repas', 'warn'); return; }

  const items = foodRows.filter(r => r.name).map(r => ({
    name: r.name,
    quantity: r.qty || 100,
    ...estimateMacros(r.name, r.qty || 100),
  }));

  const payload = { title, type, plannedDate: date, items, isDraft: true };

  try {
    document.getElementById('btnSaveDraft').textContent = '…';
    if (editingId) {
      await updateDraft(editingId, payload);
      toast('Brouillon mis à jour ✓', 'ok');
    } else {
      await createDraft(payload);
      toast('Repas planifié 📅', 'ok');
    }
    closeModal();
    await loadWeek();
  } catch(e) {
    toast('Erreur : ' + e.message, 'warn');
    document.getElementById('btnSaveDraft').textContent = editingId ? 'Enregistrer' : 'Créer le brouillon';
  }
});

// ===== WEEK NAV =====
document.getElementById('btnPrevWeek').addEventListener('click', () => {
  currentWeekStart = addDays(currentWeekStart, -7);
  loadWeek();
});
document.getElementById('btnNextWeek').addEventListener('click', () => {
  currentWeekStart = addDays(currentWeekStart, 7);
  loadWeek();
});
document.getElementById('btnThisWeek').addEventListener('click', () => {
  currentWeekStart = getMonday(new Date());
  loadWeek();
});
document.getElementById('btnNewDraft').addEventListener('click', () => openModal(null));

// ===== LOAD WEEK =====
async function loadWeek() {
  try {
    drafts = await fetchDrafts(currentWeekStart);
  } catch(e) {
    // If backend not yet updated, show empty state gracefully
    drafts = [];
  }
  renderWeek();
}

// ===== INIT =====
async function init() {
  if (!checkAuth()) return;
  try {
    await loadWeek();
  } catch(e) {
    console.error(e);
  } finally {
    document.getElementById('loadingOverlay').hidden = true;
  }
}

init();
</script>
