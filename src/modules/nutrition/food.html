<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Aliments - TrackCaloriLog</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #667eea; --secondary: #718096; --success: #48bb78;
            --danger: #f56565; --bg: #f7fafc; --dark: #2d3748;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            color: var(--dark);
            -webkit-text-size-adjust: 100%;
        }

        /* ============ HEADER ============ */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -1px; }
        header nav { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; }
        header nav a {
            color: rgba(255,255,255,0.85); text-decoration: none;
            font-weight: 500; transition: 0.3s; padding: 0.4rem 0.2rem;
        }
        header nav a:hover { color: white; }

        /* ============ MAIN ============ */
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card {
            background: white; border-radius: 12px; padding: 1.5rem;
            margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 { margin-top: 0; font-size: 1.25rem; }

        /* ============ FORM ============ */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem; margin-bottom: 1rem;
        }
        .field { display: flex; flex-direction: column; min-width: 0; }
        label {
            font-size: 0.85rem; font-weight: 600;
            color: #4a5568; margin-bottom: 0.4rem;
        }
        input {
            padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;
            font-size: 16px; width: 100%; min-height: 44px; font-family: inherit;
        }
        input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button {
            cursor: pointer; border: none; border-radius: 8px;
            padding: 0.85rem 1.2rem; font-weight: 600; font-size: 0.95rem;
            min-height: 44px; transition: 0.2s; font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #e04848; }

        .barcode-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .barcode-row input { flex: 1 1 200px; }
        .barcode-row button { flex: 0 0 auto; }

        .submit-btn { width: 100%; margin-top: 0.5rem; }

        /* ============ SCANNER ============ */
        #scannerContainer {
            display: none;
            margin-top: 1rem;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        #scannerContainer.active { display: block; }
        #reader { width: 100%; min-height: 250px; }
        #reader video { border-radius: 12px; width: 100% !important; }
        .scanner-controls {
            display: flex; justify-content: center;
            padding: 0.75rem; background: #1a202c;
        }
        .scanner-status {
            text-align: center; padding: 0.5rem;
            font-size: 0.9rem; color: #a0aec0; background: #1a202c;
        }
        .scanner-status.error { color: #fc8181; }
        .scanner-status.success { color: #68d391; }

        .loading-indicator {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .info-banner {
            background: #ebf8ff;
            border-left: 3px solid #4299e1;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: #2c5282;
        }
        .info-banner.success {
            background: #f0fff4;
            border-left-color: var(--success);
            color: #22543d;
        }

        /* ============ FILTRES ============ */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .filter-bar input {
            flex: 1 1 200px;
        }
        .filter-bar select {
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            min-height: 44px;
            background: white;
            cursor: pointer;
        }

        /* ============ BADGES SOURCE ============ */
        .source-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .source-badge.ciqual { background: #c6f6d5; color: #22543d; }
        .source-badge.openfoodfacts { background: #fed7d7; color: #742a2a; }
        .source-badge.user { background: #e2e8f0; color: #2d3748; }

        /* ============ TABLE ============ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 1rem;
        }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th {
            background: #f8fafc; text-align: left; padding: 0.85rem;
            border-bottom: 2px solid #edf2f7; font-size: 0.75rem;
            text-transform: uppercase; color: #718096; white-space: nowrap;
        }
        td { padding: 0.85rem; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }

        /* Sel et potassium - couleurs sémantiques */
        .val-salt { color: #c05621; font-weight: 600; }
        .val-potassium { color: #2b6cb0; font-weight: 600; }
        .val-empty { color: #cbd5e0; font-style: italic; font-size: 0.85rem; }

        /* ============ MOBILE ============ */
        @media (max-width: 600px) {
            header { padding: 1rem; justify-content: center; text-align: center; }
            header nav { width: 100%; justify-content: center; gap: 0.25rem 1rem; }
            header nav a { font-size: 0.9rem; }
            main { margin: 1rem auto; }
            .card { padding: 1.1rem; border-radius: 10px; margin-bottom: 1.25rem; }
            .card h2 { font-size: 1.1rem; }
            .grid-inputs { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
            .grid-inputs.full-width-mobile { grid-template-columns: 1fr; }

            .table-wrapper { overflow: visible; }
            table, thead, tbody, tr, td { display: block; width: 100%; }
            table { min-width: 0; }
            thead { display: none; }
            tbody tr {
                background: #f8fafc; border-radius: 10px;
                padding: 0.75rem 1rem; margin-bottom: 0.75rem;
                border: 1px solid #edf2f7;
            }
            tbody td {
                border: none; padding: 0.4rem 0;
                display: flex; justify-content: space-between;
                align-items: center; gap: 1rem; font-size: 0.95rem;
            }
            tbody td::before {
                content: attr(data-label);
                font-weight: 600; color: #718096;
                font-size: 0.8rem; text-transform: uppercase;
                letter-spacing: 0.02em;
            }
            tbody td:first-child {
                font-weight: 700; font-size: 1.05rem;
                padding-bottom: 0.5rem; margin-bottom: 0.4rem;
                border-bottom: 1px solid #edf2f7; display: block;
            }
            tbody td:first-child::before { display: none; }
        }

        @media (max-width: 380px) {
            .grid-inputs { grid-template-columns: 1fr; }
            header { padding: 0.85rem; }
            .logo { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">TrackCaloriLog</div>
    <nav>
        <a href="/nutrition/catalogue">Catalogue</a>
        <a href="/nutrition">Journal Repas</a>
        <a href="#" id="logoutBtn" style="color: #feb2b2;">Déconnexion</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>🔍 Ajouter au catalogue</h2>

        <div class="info-banner" id="infoBanner">
            💡 Scanne le code-barres d'un produit avec ta caméra : on récupère automatiquement les infos nutritionnelles via OpenFoodFacts.
        </div>

        <div class="field" style="margin-bottom: 1rem;">
            <label>Code-barres</label>
            <div class="barcode-row">
                <input type="text" id="barcodeInput" placeholder="Ex: 3017620422003" inputmode="numeric">
                <button type="button" class="btn-primary" id="scanBtn">📷 Scanner</button>
                <button type="button" class="btn-primary" id="lookupBtn">🔎 Chercher</button>
            </div>
        </div>

        <div id="scannerContainer">
            <div id="reader"></div>
            <div class="scanner-status" id="scannerStatus">Initialisation de la caméra…</div>
            <div class="scanner-controls">
                <button type="button" class="btn-danger" id="closeScanBtn">✕ Fermer le scanner</button>
            </div>
        </div>

        <form id="foodForm">
            <div class="grid-inputs full-width-mobile">
                <div class="field"><label>Nom</label><input type="text" id="foodName" required></div>
                <div class="field"><label>Marque</label><input type="text" id="foodBrand"></div>
            </div>
            <div class="grid-inputs">
                <div class="field"><label>Cal/100g</label><input type="number" id="calories" step="any" inputmode="decimal" required></div>
                <div class="field"><label>Prot/100g (g)</label><input type="number" id="protein" step="any" inputmode="decimal"></div>
                <div class="field"><label>Gluc/100g (g)</label><input type="number" id="carbs" step="any" inputmode="decimal"></div>
                <div class="field"><label>Lip/100g (g)</label><input type="number" id="fat" step="any" inputmode="decimal"></div>
                <div class="field"><label>Fibres/100g (g)</label><input type="number" id="fiber" step="any" inputmode="decimal"></div>
                <div class="field"><label>🧂 Sel/100g (g)</label><input type="number" id="salt" step="any" inputmode="decimal"></div>
                <div class="field"><label>⚡ Potassium/100g (mg)</label><input type="number" id="potassium" step="any" inputmode="decimal"></div>
            </div>
            <button type="submit" class="btn-primary submit-btn">Enregistrer l'aliment</button>
        </form>
    </section>

    <section class="card">
        <h2>📋 Aliments enregistrés <span id="catalogCount" style="font-weight:normal; color:#718096; font-size:0.9rem;"></span></h2>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher un aliment…">
            <select id="sourceFilter">
                <option value="all">Toutes sources</option>
                <option value="ciqual">🇫🇷 Ciqual (ANSES)</option>
                <option value="openfoodfacts">📦 OpenFoodFacts</option>
                <option value="user">✏️ Mes saisies</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Marque</th>
                        <th>Calories</th>
                        <th>Prot</th>
                        <th>🧂 Sel</th>
                        <th>⚡ Potassium</th>
                    </tr>
                </thead>
                <tbody id="catalogTableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const rawToken = localStorage.getItem('token');
    if (!rawToken) window.location.href = '/trackcalorilog/login';
    const cleanToken = rawToken.replace('Bearer ', '').replace(/"/g, '').trim();

    let FULL_CATALOG = []; // Cache local pour le filtrage côté client

    document.querySelectorAll('nav a').forEach(link => {
        if (link.id === 'logoutBtn') return;
        const href = link.getAttribute('href');
        if (href && href !== '#') {
            const separator = href.includes('?') ? '&' : '?';
            link.href = `${href}${separator}token=${cleanToken}`;
        }
    });

    window.onload = loadCatalog;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/trackcalorilog/login';
    });

    /* ===========================================================
       SCANNER
       =========================================================== */
    let html5QrCode = null;
    const scannerContainer = document.getElementById('scannerContainer');
    const scannerStatus = document.getElementById('scannerStatus');
    const scanBtn = document.getElementById('scanBtn');
    const closeScanBtn = document.getElementById('closeScanBtn');

    scanBtn.addEventListener('click', startScanner);
    closeScanBtn.addEventListener('click', stopScanner);

    async function startScanner() {
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            alert("⚠️ Le scan caméra nécessite HTTPS. Tu peux saisir le code manuellement et cliquer 'Chercher'.");
            return;
        }
        scannerContainer.classList.add('active');
        scannerStatus.className = 'scanner-status';
        scannerStatus.textContent = 'Démarrage de la caméra…';

        try {
            html5QrCode = new Html5Qrcode("reader");
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 150 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128
                ],
                aspectRatio: 1.5
            };
            await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure);
            scannerStatus.textContent = '🎯 Pointe vers un code-barres…';
        } catch (err) {
            console.error("Erreur démarrage caméra:", err);
            scannerStatus.className = 'scanner-status error';
            if (err.name === 'NotAllowedError' || String(err).includes('Permission')) {
                scannerStatus.textContent = '❌ Accès caméra refusé.';
            } else if (err.name === 'NotFoundError') {
                scannerStatus.textContent = '❌ Aucune caméra détectée.';
            } else {
                scannerStatus.textContent = '❌ Erreur : ' + (err.message || err);
            }
        }
    }

    async function stopScanner() {
        if (html5QrCode) {
            try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
            html5QrCode = null;
        }
        scannerContainer.classList.remove('active');
    }

    async function onScanSuccess(decodedText) {
        scannerStatus.className = 'scanner-status success';
        scannerStatus.textContent = '✅ Code détecté : ' + decodedText;
        if (navigator.vibrate) navigator.vibrate(150);
        document.getElementById('barcodeInput').value = decodedText;
        await stopScanner();
        await lookupProduct(decodedText);
    }

    function onScanFailure() { /* ignoré */ }

    /* ===========================================================
       OPENFOODFACTS (via proxy)
       =========================================================== */
    const lookupBtn = document.getElementById('lookupBtn');
    lookupBtn.addEventListener('click', () => {
        const code = document.getElementById('barcodeInput').value.trim();
        if (!code) { alert("Saisis ou scanne d'abord un code-barres."); return; }
        lookupProduct(code);
    });

    async function lookupProduct(barcode) {
        const originalText = lookupBtn.textContent;
        lookupBtn.disabled = true;
        lookupBtn.innerHTML = 'Recherche<span class="loading-indicator"></span>';

        try {
            const response = await fetch(`/api/nutrition/openfoodfacts/${barcode}`, {
                headers: { 'Authorization': `Bearer ${cleanToken}` }
            });

            if (response.status === 404) {
                alert("⚠️ Produit non trouvé dans OpenFoodFacts.\n\nTu peux remplir les infos manuellement et l'enregistrer.");
                document.getElementById('foodName').focus();
                return;
            }
            if (!response.ok) throw new Error("Erreur HTTP " + response.status);

            const product = await response.json();
            fillFormFromOpenFoodFacts(product);
        } catch (error) {
            console.error("Erreur OpenFoodFacts:", error);
            alert("❌ Impossible de contacter le serveur.");
        } finally {
            lookupBtn.disabled = false;
            lookupBtn.textContent = originalText;
        }
    }

    function fillFormFromOpenFoodFacts(product) {
        document.getElementById('foodName').value = product.name || '';
        document.getElementById('foodBrand').value = product.brand || '';
        document.getElementById('calories').value = product.calories100g ?? '';
        document.getElementById('protein').value = product.proteins100g ?? '';
        document.getElementById('carbs').value = product.carbs100g ?? '';
        document.getElementById('fat').value = product.fats100g ?? '';
        document.getElementById('fiber').value = product.fiber100g ?? '';
        document.getElementById('salt').value = product.salt100g ?? '';
        document.getElementById('potassium').value = product.potassium100g ?? '';

        const banner = document.getElementById('infoBanner');
        const original = banner.innerHTML;
        const originalClass = banner.className;
        banner.className = 'info-banner success';
        const kInfo = product.potassium100g != null
            ? ` (Potassium : ${product.potassium100g} mg/100g ✅)`
            : ' (Potassium non renseigné chez OFF ⚠️)';
        banner.innerHTML = `✅ Produit trouvé : <strong>${product.name || 'sans nom'}</strong>${product.brand ? ' — ' + product.brand : ''}${kInfo}. Vérifie et clique "Enregistrer".`;

        setTimeout(() => {
            banner.className = originalClass;
            banner.innerHTML = original;
        }, 6000);
    }

    /* ===========================================================
       CATALOGUE
       =========================================================== */
    async function loadCatalog() {
        try {
            const response = await fetch('/api/nutrition/allFood', {
                headers: { 'Authorization': `Bearer ${cleanToken}` }
            });
            const data = await response.json();
            if (Array.isArray(data)) {
                FULL_CATALOG = data;
                applyFilters();
            }
        } catch (error) { console.error("Erreur chargement:", error); }
    }

    // Filtrage côté client (rapide, pas besoin de re-fetch)
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('sourceFilter').addEventListener('change', applyFilters);

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        const sourceFilter = document.getElementById('sourceFilter').value;

        let filtered = FULL_CATALOG;

        if (sourceFilter !== 'all') {
            filtered = filtered.filter(f => (f.source || 'user') === sourceFilter);
        }

        if (search) {
            filtered = filtered.filter(f =>
                (f.name || '').toLowerCase().includes(search) ||
                (f.brand || '').toLowerCase().includes(search)
            );
        }

        renderCatalog(filtered);
    }

    function formatVal(val, unit, className) {
        if (val == null || val === 0) {
            return `<span class="val-empty">—</span>`;
        }
        const formatted = Number(val).toLocaleString('fr-FR');
        return `<span class="${className}">${formatted} ${unit}</span>`;
    }

    function sourceBadge(source) {
        const s = source || 'user';
        const labels = { ciqual: 'Ciqual', openfoodfacts: 'OFF', user: 'Perso' };
        return `<span class="source-badge ${s}">${labels[s] || s}</span>`;
    }

    function renderCatalog(catalog) {
        const body = document.getElementById('catalogTableBody');
        document.getElementById('catalogCount').textContent = `(${catalog.length} aliment${catalog.length > 1 ? 's' : ''})`;

        if (catalog.length === 0) {
            body.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:#a0aec0;">Aucun aliment</td></tr>';
            return;
        }

        body.innerHTML = catalog.map(f => `
            <tr>
                <td data-label="Nom">${f.name}${sourceBadge(f.source)}</td>
                <td data-label="Marque">${f.brand || '-'}</td>
                <td data-label="Calories">${Number(f.calories100g || 0).toLocaleString('fr-FR')} kcal</td>
                <td data-label="Protéines">${Number(f.proteins100g || 0).toLocaleString('fr-FR')} g</td>
                <td data-label="Sel">${formatVal(f.salt100g, 'g', 'val-salt')}</td>
                <td data-label="Potassium">${formatVal(f.potassium100g, 'mg', 'val-potassium')}</td>
            </tr>
        `).join('');
    }

    /* ===========================================================
       SOUMISSION
       =========================================================== */
    document.getElementById('foodForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const barcodeValue = document.getElementById('barcodeInput').value.trim();

        const newFood = {
            name: document.getElementById('foodName').value,
            brand: document.getElementById('foodBrand').value,
            calories100g: parseFloat(document.getElementById('calories').value) || 0,
            proteins100g: parseFloat(document.getElementById('protein').value) || 0,
            carbs100g: parseFloat(document.getElementById('carbs').value) || 0,
            fats100g: parseFloat(document.getElementById('fat').value) || 0,
            fiber100g: parseFloat(document.getElementById('fiber').value) || 0,
            salt100g: parseFloat(document.getElementById('salt').value) || 0,
            potassium100g: parseFloat(document.getElementById('potassium').value) || 0,
            source: barcodeValue ? 'openfoodfacts' : 'user' // si barcode -> probablement OFF
        };

        if (barcodeValue !== "") {
            newFood.barcode = barcodeValue;
        }

        try {
            const response = await fetch('/api/nutrition/addFood', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${cleanToken}`
                },
                body: JSON.stringify(newFood)
            });

            if (response.ok) {
                alert("Aliment enregistré !");
                e.target.reset();
                document.getElementById('barcodeInput').value = "";
                loadCatalog();
            } else {
                const errorData = await response.json();
                alert("Erreur: " + (errorData.error || errorData.message));
            }
        } catch (error) { alert("Erreur serveur."); }
    });
</script>
</body>
</html>
