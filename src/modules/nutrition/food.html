<head>
    <meta charset="UTF-8" />

    <title>Catalogue Aliments - TrackCaloriLog</title>
    <style>
        :root {
            --primary: #667eea; --secondary: #718096; --success: #48bb78;
            --danger: #f56565; --bg: #f7fafc; --dark: #2d3748;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            color: var(--dark);
            -webkit-text-size-adjust: 100%;
        }

        /* ============ HEADER ============ */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        header nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem 1.5rem;
        }
        header nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            padding: 0.4rem 0.2rem;
        }
        header nav a:hover { color: white; }

        /* ============ MAIN ============ */
        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
        }

        /* ============ FORM ============ */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .field {
            display: flex;
            flex-direction: column;
            min-width: 0; /* évite les débordements en grid */
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.4rem;
        }
        input {
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px; /* évite le zoom auto sur iOS */
            width: 100%;
            min-height: 44px; /* taille tactile recommandée */
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.85rem 1.2rem;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 44px;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-primary:active { transform: scale(0.98); }

        .barcode-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .barcode-row input {
            flex: 1 1 200px;
        }
        .barcode-row button {
            flex: 0 0 auto;
        }

        .submit-btn {
            width: 100%;
            margin-top: 0.5rem;
        }

        /* ============ TABLE (desktop) ============ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        th {
            background: #f8fafc;
            text-align: left;
            padding: 1rem;
            border-bottom: 2px solid #edf2f7;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #718096;
            white-space: nowrap;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.9rem;
        }

        /* ============ MOBILE : table -> cards ============ */
        @media (max-width: 600px) {
            header {
                padding: 1rem;
                justify-content: center;
                text-align: center;
            }
            header nav {
                width: 100%;
                justify-content: center;
                gap: 0.25rem 1rem;
            }
            header nav a {
                font-size: 0.9rem;
            }
            main {
                margin: 1rem auto;
            }
            .card {
                padding: 1.1rem;
                border-radius: 10px;
                margin-bottom: 1.25rem;
            }
            .card h2 {
                font-size: 1.1rem;
            }
            .grid-inputs {
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }
            /* nom et marque en pleine largeur */
            .grid-inputs.full-width-mobile {
                grid-template-columns: 1fr;
            }

            /* Transformation table -> cartes empilées */
            .table-wrapper { overflow: visible; }
            table, thead, tbody, tr, td {
                display: block;
                width: 100%;
            }
            table { min-width: 0; }
            thead { display: none; }
            tbody tr {
                background: #f8fafc;
                border-radius: 10px;
                padding: 0.75rem 1rem;
                margin-bottom: 0.75rem;
                border: 1px solid #edf2f7;
            }
            tbody td {
                border: none;
                padding: 0.4rem 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                font-size: 0.95rem;
            }
            tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #718096;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.02em;
            }
            tbody td:first-child {
                font-weight: 700;
                font-size: 1.05rem;
                padding-bottom: 0.5rem;
                margin-bottom: 0.4rem;
                border-bottom: 1px solid #edf2f7;
                display: block; /* le nom prend toute la ligne, sans label */
            }
            tbody td:first-child::before {
                display: none;
            }
        }

        /* ============ TRES PETIT (< 380px) ============ */
        @media (max-width: 380px) {
            .grid-inputs {
                grid-template-columns: 1fr;
            }
            header { padding: 0.85rem; }
            .logo { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">TrackCaloriLog</div>
    <nav>
        <a href="/nutrition/catalogue">Catalogue</a>
        <a href="/nutrition">Journal Repas</a>
        <a href="#" id="logoutBtn" style="color: #feb2b2;">Déconnexion</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>🔍 Ajouter au catalogue</h2>
        <div class="field" style="margin-bottom: 1rem;">
            <label>Code-barres (Simuler Scan)</label>
            <div class="barcode-row">
                <input type="text" id="barcodeInput" placeholder="Ex: 3017620422003" inputmode="numeric">
                <button type="button" class="btn-primary" onclick="simulateScan()">Scanner</button>
            </div>
        </div>
        <form id="foodForm">
            <div class="grid-inputs full-width-mobile">
                <div class="field"><label>Nom</label><input type="text" id="foodName" required></div>
                <div class="field"><label>Marque</label><input type="text" id="foodBrand"></div>
            </div>
            <div class="grid-inputs">
                <div class="field"><label>Cal/100g</label><input type="number" id="calories" step="any" inputmode="decimal" required></div>
                <div class="field"><label>Prot/100g</label><input type="number" id="protein" step="any" inputmode="decimal"></div>
                <div class="field"><label>Gluc/100g</label><input type="number" id="carbs" step="any" inputmode="decimal"></div>
                <div class="field"><label>Lip/100g</label><input type="number" id="fat" step="any" inputmode="decimal"></div>
                <div class="field"><label>Fibres/100g</label><input type="number" id="fiber" step="any" inputmode="decimal"></div>
                <div class="field"><label>Sel/100g</label><input type="number" id="salt" step="any" inputmode="decimal"></div>
            </div>
            <button type="submit" class="btn-primary submit-btn">Enregistrer l'aliment</button>
        </form>
    </section>

    <section class="card">
        <h2>📋 Aliments enregistrés</h2>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Nom</th><th>Marque</th><th>Calories</th><th>Proteines</th></tr></thead>
                <tbody id="catalogTableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const rawToken = localStorage.getItem('token');
    if (!rawToken) window.location.href = '/trackcalorilog/login';
    const cleanToken = rawToken.replace('Bearer ', '').replace(/"/g, '').trim();

    // Mise à jour des liens nav
    document.querySelectorAll('nav a').forEach(link => {
        if (link.id === 'logoutBtn') return;
        const href = link.getAttribute('href');
        if (href && href !== '#') {
            const separator = href.includes('?') ? '&' : '?';
            link.href = `${href}${separator}token=${cleanToken}`;
        }
    });

    window.onload = loadCatalog;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/trackcalorilog/login';
    });

    async function loadCatalog() {
        try {
            const response = await fetch('/api/nutrition/allFood', {
                headers: { 'Authorization': `Bearer ${cleanToken}` }
            });
            const data = await response.json();
            if (Array.isArray(data)) renderCatalog(data);
        } catch (error) { console.error("Erreur chargement:", error); }
    }

    function renderCatalog(catalog) {
        const body = document.getElementById('catalogTableBody');
        body.innerHTML = catalog.length === 0
            ? '<tr><td colspan="4" style="text-align:center">Aucun aliment</td></tr>'
            : catalog.map(f => `
                <tr>
                    <td data-label="Nom">${f.name}</td>
                    <td data-label="Marque">${f.brand || '-'}</td>
                    <td data-label="Calories">${Number(f.calories100g).toLocaleString('fr-FR')} kcal</td>
                    <td data-label="Protéines">${Number(f.proteins100g).toLocaleString('fr-FR')} g</td>
                </tr>
            `).join('');
    }

    function simulateScan() {
        document.getElementById('foodName').value = "Aliment Scanné Test";
        document.getElementById('calories').value = 250.5;
        document.getElementById('protein').value = 12.3;
        alert("Scan réussi !");
    }

    document.getElementById('foodForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const barcodeValue = document.getElementById('barcodeInput').value.trim();

        const newFood = {
            name: document.getElementById('foodName').value,
            brand: document.getElementById('foodBrand').value,
            calories100g: parseFloat(document.getElementById('calories').value) || 0,
            proteins100g: parseFloat(document.getElementById('protein').value) || 0,
            carbs100g: parseFloat(document.getElementById('carbs').value) || 0,
            fats100g: parseFloat(document.getElementById('fat').value) || 0,
            fiber100g: parseFloat(document.getElementById('fiber').value) || 0,
            salt100g: parseFloat(document.getElementById('salt').value) || 0
        };

        if (barcodeValue !== "") {
            newFood.barcode = barcodeValue;
        }

        try {
            const response = await fetch('/api/nutrition/addFood', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${cleanToken}`
                },
                body: JSON.stringify(newFood)
            });

            if (response.ok) {
                alert("Aliment enregistré !");
                e.target.reset();
                document.getElementById('barcodeInput').value = "";
                loadCatalog();
            } else {
                const errorData = await response.json();
                alert("Erreur: " + (errorData.error || errorData.message));
            }
        } catch (error) { alert("Erreur serveur."); }
    });
</script>
</body>

        if (barcodeValue !== "") {
            newFood.barcode = barcodeValue;
        }

        try {
            const response = await fetch('/api/nutrition/addFood', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${cleanToken}`
                },
                body: JSON.stringify(newFood)
            });

            if (response.ok) {
                alert("Aliment enregistré !");
                e.target.reset();
                document.getElementById('barcodeInput').value = "";
                loadCatalog();
            } else {
                const errorData = await response.json();
                alert("Erreur: " + (errorData.error || errorData.message));
            }
        } catch (error) { alert("Erreur serveur."); }
    });
</script>
</body>
</html>
