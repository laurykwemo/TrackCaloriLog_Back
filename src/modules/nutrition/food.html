<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Aliments - TrackCaloriLog</title>
    <style>
        :root {
            --primary: #667eea; --secondary: #718096; --success: #48bb78;
            --danger: #f56565; --bg: #f7fafc; --dark: #2d3748;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; color: var(--dark); }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header nav a { color: rgba(255,255,255,0.8); margin-left: 1.5rem; text-decoration: none; font-weight: 500; transition: 0.3s; }
        header nav a:hover { color: white; }
        main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.4rem; }
        input { padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 0.7rem 1.2rem; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { background: #f8fafc; text-align: left; padding: 1rem; border-bottom: 2px solid #edf2f7; font-size: 0.8rem; text-transform: uppercase; color: #718096; }
        td { padding: 1rem; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.4rem; font-weight: 800; letter-spacing: -1px;">TrackCaloriLog</div>
    <nav>
        <a href="/nutrition/catalogue">Catalogue</a>
        <a href="/nutrition">Journal Repas</a>
        <a href="#" id="logoutBtn" style="color: #feb2b2;">Déconnexion</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>🔍 Ajouter au catalogue</h2>
        <div class="field" style="margin-bottom: 1rem;">
            <label>Code-barres (Simuler Scan)</label>
            <div style="display:flex; gap:0.5rem">
                <input type="text" id="barcodeInput" placeholder="Ex: 3017620422003">
                <button type="button" class="btn-primary" onclick="simulateScan()">Scanner</button>
            </div>
        </div>
        <form id="foodForm">
            <div class="grid-inputs">
                <div class="field"><label>Nom</label><input type="text" id="foodName" required></div>
                <div class="field"><label>Marque</label><input type="text" id="foodBrand"></div>
            </div>
            <div class="grid-inputs">
                <div class="field"><label>Cal/100g</label><input type="number" id="calories" step="any" required></div>
                <div class="field"><label>Prot/100g</label><input type="number" id="protein" step="any"></div>
                <div class="field"><label>Gluc/100g</label><input type="number" id="carbs" step="any"></div>
                <div class="field"><label>Lip/100g</label><input type="number" id="fat" step="any"></div>
                <div class="field"><label>Fibres/100g</label><input type="number" id="fiber" step="any"></div>
                <div class="field"><label>Sel/100g</label><input type="number" id="salt" step="any"></div>
            </div>
            <button type="submit" class="btn-primary">Enregistrer l'aliment</button>
        </form>
    </section>

    <section class="card">
        <h2>📋 Aliments enregistrés</h2>
        <table>
            <thead><tr><th>Nom</th><th>Marque</th><th>Calories</th><th>Proteines</th></tr></thead>
            <tbody id="catalogTableBody"></tbody>
        </table>
    </section>
</main>

<script>
    const rawToken = localStorage.getItem('token');
    if (!rawToken) window.location.href = '/trackcalorilog/login';
    const cleanToken = rawToken.replace('Bearer ', '').replace(/"/g, '').trim();

    // Mise à jour des liens nav
    document.querySelectorAll('nav a').forEach(link => {
        if (link.id === 'logoutBtn') return;
        const href = link.getAttribute('href');
        if (href && href !== '#') {
            const separator = href.includes('?') ? '&' : '?';
            link.href = `${href}${separator}token=${cleanToken}`;
        }
    });

    window.onload = loadCatalog;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/trackcalorilog/login';
    });

    async function loadCatalog() {
        try {
            const response = await fetch('/api/nutrition/allFood', {
                headers: { 'Authorization': `Bearer ${cleanToken}` }
            });
            const data = await response.json();
            if (Array.isArray(data)) renderCatalog(data);
        } catch (error) { console.error("Erreur chargement:", error); }
    }

    function renderCatalog(catalog) {
        const body = document.getElementById('catalogTableBody');
        body.innerHTML = catalog.length === 0 
            ? '<tr><td colspan="4" style="text-align:center">Aucun aliment</td></tr>'
            : catalog.map(f => `
                <tr>
                    <td>${f.name}</td>
                    <td>${f.brand || '-'}</td>
                    <td>${Number(f.calories100g).toLocaleString('fr-FR')} kcal</td>
                    <td>${Number(f.proteins100g).toLocaleString('fr-FR')} g</td>
                </tr>
            `).join('');
    }

    function simulateScan() {
        document.getElementById('foodName').value = "Aliment Scanné Test";
        document.getElementById('calories').value = 250.5;
        document.getElementById('protein').value = 12.3;
        alert("Scan réussi !");
    }

    document.getElementById('foodForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // RÉCUPÉRATION ET NETTOYAGE DU CODE BARRE
        const barcodeValue = document.getElementById('barcodeInput').value.trim();

        const newFood = {
            name: document.getElementById('foodName').value,
            brand: document.getElementById('foodBrand').value,
            calories100g: parseFloat(document.getElementById('calories').value) || 0,
            proteins100g: parseFloat(document.getElementById('protein').value) || 0,
            carbs100g: parseFloat(document.getElementById('carbs').value) || 0,
            fats100g: parseFloat(document.getElementById('fat').value) || 0,
            fiber100g: parseFloat(document.getElementById('fiber').value) || 0,
            salt100g: parseFloat(document.getElementById('salt').value) || 0
        };

        // ON N'ENVOIE LE BARCODE QUE S'IL N'EST PAS VIDE
        // Cela évite l'erreur E11000 duplicate key ""
        if (barcodeValue !== "") {
            newFood.barcode = barcodeValue;
        }

        try {
            const response = await fetch('/api/nutrition/addFood', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${cleanToken}`
                },
                body: JSON.stringify(newFood)
            });

            if (response.ok) {
                alert("Aliment enregistré !");
                e.target.reset();
                document.getElementById('barcodeInput').value = "";
                loadCatalog();
            } else {
                const errorData = await response.json();
                alert("Erreur: " + (errorData.error || errorData.message));
            }
        } catch (error) { alert("Erreur serveur."); }
    });
</script>
</body>
</html>
