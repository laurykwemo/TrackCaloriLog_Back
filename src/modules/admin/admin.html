<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">

    <div class="d-flex justify-content-between mb-3">
        <h2>👨‍💼 Admin Dashboard</h2>
        <a href="/" class="btn btn-secondary">Retour à l'espace User</a>
    </div>

    <div class="mb-4">
        <button onclick="loadStats()" class="btn btn-info">📊 Voir Statistiques</button>
        <div id="statsContainer" class="mt-3"></div>
    </div>

    <div class="table-container table-responsive">
        <div class="d-flex justify-content-between mb-3">
            <h4>📋 Gestion des utilisateurs</h4>
            <input type="text" id="search" class="form-control w-25" placeholder="Search users..." />
        </div>
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Birth</th>
                    <th>Sexe</th>
                    <th>Height</th>
                    <th>Weight</th>
                    <th>Role</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>

    <div class="table-container table-responsive">
        <div class="d-flex justify-content-between mb-3">
            <h4>📋 Gestion des utilisateurs supprimés</h4>
            <input type="text" id="searchd" class="form-control w-25" placeholder="Search users..." />
        </div>
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Birth</th>
                    <th>Sexe</th>
                    <th>Height</th>
                    <th>Weight</th>
                    <th>Role</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="adminTableBodyd"></tbody>
        </table>
    </div>

<script>
    let sexs = [];
    let users = [];
    let usersd = [];

    async function loadSex() {
        const response = await fetch('http://localhost:3000/api/AllSexes');
        sexs = await response.json();
    }

    async function loadAdminUsers() {
        await loadSex();
        const response = await fetch('http://localhost:3000/api/AllUsers');
        users = await response.json();

        // FIX : simplifier sex en ID
        users = users.map(u => ({
            ...u,
            sex: typeof u.sex === "object" ? u.sex._id : u.sex
        }));

        const tbodyd = document.getElementById('adminTableBody');
        tbodyd.innerHTML = users.map(user => `
            <tr data-id="${user._id}">
                <td ondblclick="makeEditable(this)">${user.name}</td>
                <td ondblclick="makeEditable(this)">${user.email}</td>
                <td ondblclick="makeEditable(this)">${user.birthDate?.substring(0,10) || ''}</td>

                <!-- FIX : on NE DOIT PAS appeler sex.label -->
                <td ondblclick="makeEditable(this, 'sex')">
                    ${getSexLabel(user.sex)}
                </td>

                <td ondblclick="makeEditable(this)">${user.height}</td>
                <td ondblclick="makeEditable(this)">${user.weight}</td>
                <td ondblclick="makeEditable(this, 'role')">${user.role}</td>
                <td ondblclick="makeEditable(this, 'isActive')">
                    ${user.isActive ? 'Active' : 'Inactive'}
                </td>
                <td>
                    <button class="btn btn-success btn-sm" onclick="saveRow('${user._id}')">💾 Save</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser('${user._id}')">🗑 Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadAdminUsersd() {
        await loadSex();
        const response = await fetch('http://localhost:3000/api/deletedusers');
        usersd = await response.json();

        // FIX : simplifier sex en ID
        usersd = usersd.map(u => ({
            ...u,
            sex: typeof u.sex === "object" ? u.sex._id : u.sex
        }));

        const tbodyd = document.getElementById('adminTableBodyd');
        tbodyd.innerHTML = usersd.map(user => `
            <tr data-id="${user._id}">
                <td ondblclick="makeEditable(this)">${user.name}</td>
                <td ondblclick="makeEditable(this)">${user.email}</td>
                <td ondblclick="makeEditable(this)">${user.birthDate?.substring(0,10) || ''}</td>

                <!-- FIX : on NE DOIT PAS appeler sex.label -->
                <td ondblclick="makeEditable(this, 'sex')">
                    ${getSexLabel(user.sex)}
                </td>

                <td ondblclick="makeEditable(this)">${user.height}</td>
                <td ondblclick="makeEditable(this)">${user.weight}</td>
                <td ondblclick="makeEditable(this, 'role')">${user.role}</td>
                <td ondblclick="makeEditable(this, 'isActive')">
                    ${user.isActive ? 'Active' : 'Inactive'}
                </td>
                <td>
                    <button class="btn btn-success btn-sm" onclick="saveRowd('${user._id}')">💾 Save</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUserd('${user._id}')">🗑 Delete</button>
                    <button class="btn btn-primary btn-sm" onclick="restoreUserd('${user._id}')">♻️ Restore</button>
                </td>
            </tr>
        `).join('');
    }

    function makeEditable(cell, type = 'text') {
        const oldValue = cell.innerText.trim();
        cell.setAttribute('data-old-value', oldValue);

        if (type === 'sex') {
            const options = sexs.map(s => `<option value="${s._id}">${s.label}</option>`).join('');
            cell.innerHTML = `<select class="form-select form-select-sm">${options}</select>`;
        }
        else if (type === 'role') {
            cell.innerHTML = `
                <select class="form-select form-select-sm">
                    <option value="User">User</option>
                    <option value="Admin">Admin</option>
                </select>`;
        }
        else if (type === 'isActive') {
            const userId = cell.closest('tr').dataset.id;

            cell.innerHTML = `
                <select 
                    class="form-select form-select-sm"
                    onchange="updateUserStatus('${userId}', this.value === 'true')"
                >
                    <option value="true" ${cell.getAttribute('data-old-value') === 'Active' ? 'selected' : ''}>
                        Active
                    </option>
                    <option value="false" ${cell.getAttribute('data-old-value') === 'Inactive' ? 'selected' : ''}>
                        Inactive
                    </option>
                </select>
                `;
        }
        else {
            cell.innerHTML = `<input type="text" class="form-control form-control-sm" value="${oldValue}">`;
        }
    }

    // Fonction utilitaire pour extraire la valeur d'une cellule
    function getCellValue(cell) {
        const input = cell.querySelector('input, select');
        // Si la cellule est en mode édition, on prend la valeur de l'input/select
        if (input) {
            // Pour un select, on s'assure que la valeur est convertie en booléen pour isActive
            if (cell.getAttribute('data-old-value') === 'Active' || cell.getAttribute('data-old-value') === 'Inactive') {
                return input.value === "true"; // Retourne un booléen
            }
            return input.value; // Retourne la valeur de l'input/select
        }
        // Sinon, on prend le texte de la cellule (mode non-édition)
        const text = cell.innerText.trim();
        // Gérer les cas où innerText est 'Active'/'Inactive' pour isActive
        if (cell.cellIndex === 7) { // Colonne Active (index 7)
            return text === 'Active'; // Retourne un booléen
        }
        return text;
    }

    async function saveRow(userId) {
        const row = document.querySelector(`tr[data-id="${userId}"]`);
        if (!row) return;

        // Récupérer les cellules <td> (colonne Actions exclue pour les indices ici, mais incluse dans cells)
        const cells = row.querySelectorAll('td');

        // Récupérer l'utilisateur existant pour utiliser les valeurs non éditées
        const existingUser = users.find(u => u._id === userId);

        // Construction de l'objet de mise à jour avec les indices corrigés
        const updatedUser = {
            name: getCellValue(cells[0]),
            email: getCellValue(cells[1]),
            birthDate: getCellValue(cells[2]),
            // cells[3] est Sexe. Si c'est un sélecteur, on prend sa value (l'ID du sexe). 
            // Sinon, on prend l'ID du sexe de l'utilisateur existant (car c'est déjà un ID après le map dans loadAdminUsers)
            sex: cells[3].querySelector('select') 
                ? cells[3].querySelector('select').value 
                : existingUser.sex, 
                
            height: getCellValue(cells[4]),
            weight: getCellValue(cells[5]),
            // cells[6] est Role.
            role: cells[6].querySelector('select') 
                ? cells[6].querySelector('select').value 
                : cells[6].innerText.trim().toLowerCase(), // Utilise innerText s'il n'y a pas de select
                
            // cells[7] est Active. getCellValue gère la conversion en booléen ici.
            isActive: getCellValue(cells[7]) 
        };

        await updateUserStatus(userId, updatedUser.isActive);

        try {
            const response = await fetch(`http://localhost:3000/api/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedUser)
            });

            if (response.ok) {
                alert('Utilisateur modifié avec succès !');
                // FIX : Vous appeliez loadUser() qui n'existe pas. Il faut appeler loadAdminUsers()
                await loadAdminUsers(); 
            } else {
                const errorData = await response.json();
                alert('Erreur lors de la modification : ' + (errorData.message || response.statusText));
            }
        } catch (error) {
            alert("Une erreur de communication est survenue.");
        }
    }

    async function saveRowd(userId) {
        const row = document.querySelector(`tr[data-id="${userId}"]`);
        if (!row) return;

        // Récupérer les cellules <td> (colonne Actions exclue pour les indices ici, mais incluse dans cells)
        const cells = row.querySelectorAll('td');

        // Récupérer l'utilisateur existant pour utiliser les valeurs non éditées
        const existingUser = usersd.find(u => u._id === userId);

        // Construction de l'objet de mise à jour avec les indices corrigés
        const updatedUser = {
            name: getCellValue(cells[0]),
            email: getCellValue(cells[1]),
            birthDate: getCellValue(cells[2]),
            // cells[3] est Sexe. Si c'est un sélecteur, on prend sa value (l'ID du sexe). 
            // Sinon, on prend l'ID du sexe de l'utilisateur existant (car c'est déjà un ID après le map dans loadAdminUsers)
            sex: cells[3].querySelector('select') 
                ? cells[3].querySelector('select').value 
                : existingUser.sex, 
                
            height: getCellValue(cells[4]),
            weight: getCellValue(cells[5]),
            // cells[6] est Role.
            role: cells[6].querySelector('select') 
                ? cells[6].querySelector('select').value 
                : cells[6].innerText.trim().toLowerCase(), // Utilise innerText s'il n'y a pas de select
                
            // cells[7] est Active. getCellValue gère la conversion en booléen ici.
            isActive: getCellValue(cells[7]) 
        };

        await updateUserStatus(userId, updatedUser.isActive);

        try {
            const response = await fetch(`http://localhost:3000/api/deletedusers/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedUser)
            });

            if (response.ok) {
                alert('Utilisateur modifié avec succès !');
                // FIX : Vous appeliez loadUser() qui n'existe pas. Il faut appeler loadAdminUsers()
                await loadAdminUsersd(); 
            } else {
                const errorData = await response.json();
                alert('Erreur lors de la modification : ' + (errorData.message || response.statusText));
            }
        } catch (error) {
            alert("Une erreur de communication est survenue.");
        }
    }

    function getValue(cell) {
        const input = cell.querySelector('input, select');
        return input ? input.value : cell.innerText.trim();
    }

    async function deleteUser(userId) {
        if (!confirm("Supprimer cet utilisateur ?")) return;

        try {
            const response = await fetch(`http://localhost:3000/api/${userId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("Utilisateur supprimé avec succès !");
                await loadAdminUsers();
                await loadAdminUsersd();
            } else {
                alert("Erreur lors de la suppression.");
            }
        } catch (error) {
            alert("Erreur lors de la suppression.");
        }
    }

    async function deleteUserd(userId) {
        if (!confirm("Supprimer cet utilisateur ?")) return;

        try {
            const response = await fetch(`http://localhost:3000/api/deletedusers/${userId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("Utilisateur supprimé avec succès !");
                await loadAdminUsersd();
            } else {
                alert("Erreur lors de la suppression.");
            }
        } catch (error) {
            alert("Erreur lors de la suppression.");
        }
    }

    async function restoreUserd(userId){
        if(confirm("Voulez-vous VRAIMENT restaurer cet utilisateur ?")){
            const response = await fetch(
                `http://localhost:3000/api/deletedusers/restore/${userId}`,
                { method: 'POST' }
            );

            if(response.ok){
                alert("Utilisateur restauré !");
                await loadAdminUsers();
                await loadAdminUsersd();
            } else {
                alert("Erreur restauration.");
            }
        }
    }

    function getSexLabel(sexField) {
        if (!sexField) return 'N/A';
        if (typeof sexField === 'object') return sexField.label; // populate actif
        const sex = sexs.find(s => s._id === sexField); // sinon ID
        return sex ? sex.label : 'N/A';
    }

    document.getElementById('search').addEventListener('input', function () {
        const value = this.value.toLowerCase();
        const filteredUsers = users.filter(user =>
            JSON.stringify(user).toLowerCase().includes(value)
        );
        renderUsers(filteredUsers);
    });

    document.getElementById('searchd').addEventListener('input', function () {
        const value = this.value.toLowerCase();
        const filteredUsers = usersd.filter(user =>
            JSON.stringify(user).toLowerCase().includes(value)
        );
        renderDeletedUsers(filteredUsers);
    });

    function renderUsers(list) {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = list.map(user => `
            <tr data-id="${user._id}">
                <td ondblclick="makeEditable(this)">${user.name}</td>
                <td ondblclick="makeEditable(this)">${user.email}</td>
                <td ondblclick="makeEditable(this)">${user.birthDate?.substring(0,10) || ''}</td>

                <!-- FIX : on NE DOIT PAS appeler sex.label -->
                <td ondblclick="makeEditable(this, 'sex')">
                    ${getSexLabel(user.sex)}
                </td>

                <td ondblclick="makeEditable(this)">${user.height}</td>
                <td ondblclick="makeEditable(this)">${user.weight}</td>
                <td ondblclick="makeEditable(this, 'role')">${user.role}</td>
                <td ondblclick="makeEditable(this, 'isActive')">
                    ${user.isActive ? 'Active' : 'Inactive'}
                </td>
                <td>
                    <button class="btn btn-success btn-sm" onclick="saveRowd('${user._id}')">💾 Save</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUserd('${user._id}')">🗑 Delete</button>
                    <button class="btn btn-primary btn-sm" onclick="restoreUserd('${user._id}')">♻️ Restore</button>
                </td>
            </tr>
        `).join('');
    }

    function renderDeletedUsers(list) {
        const tbody = document.getElementById('adminTableBodyd');
        tbody.innerHTML = list.map(user => `
            <tr data-id="${user._id}">
                <td ondblclick="makeEditable(this)">${user.name}</td>
                <td ondblclick="makeEditable(this)">${user.email}</td>
                <td ondblclick="makeEditable(this)">${user.birthDate?.substring(0,10) || ''}</td>

                <!-- FIX : on NE DOIT PAS appeler sex.label -->
                <td ondblclick="makeEditable(this, 'sex')">
                    ${getSexLabel(user.sex)}
                </td>

                <td ondblclick="makeEditable(this)">${user.height}</td>
                <td ondblclick="makeEditable(this)">${user.weight}</td>
                <td ondblclick="makeEditable(this, 'role')">${user.role}</td>
                <td ondblclick="makeEditable(this, 'isActive')">
                    ${user.isActive ? 'Active' : 'Inactive'}
                </td>
                <td>
                    <button class="btn btn-success btn-sm" onclick="saveRowd('${user._id}')">💾 Save</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUserd('${user._id}')">🗑 Delete</button>
                    <button class="btn btn-primary btn-sm" onclick="restoreUserd('${user._id}')">♻️ Restore</button>
                </td>
            </tr>
        `).join('');
    }

    async function updateUserStatus(userId, isActive) {
        try {
            const response = await fetch(
                `http://localhost:3000/api/${userId}/status`,
                {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isActive })
                }
            );

            if (!response.ok) {
                throw new Error("Erreur mise à jour statut");
            }

        } catch (error) {
            console.error(error);
            alert("Erreur lors de la mise à jour du statut");
        }
    }

    window.onload = () => {
        loadSex();
        loadAdminUsers();
        loadAdminUsersd();
    };
</script>

</body>
</html>
