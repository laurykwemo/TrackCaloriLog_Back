<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue - TrackCaloriLog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --nutrition: #10b981;
            --activity: #8b5cf6;
            --admin: #3b82f6;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, var(--primary), var(--secondary));
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        /* Décoration de fond */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            z-index: -1;
            filter: blur(40px);
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 32px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin: 0 auto 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }

        button i { font-size: 18px; }

        #nutritionBtn { background-color: var(--nutrition); }
        #nutritionBtn:hover { 
            background-color: #059669;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        #activityBtn { background-color: var(--activity); }
        #activityBtn:hover { 
            background-color: #7c3aed;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        #adminBtn { background-color: var(--admin); }
        #adminBtn:hover { 
            background-color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        .logout-link {
            margin-top: 24px;
            color: var(--danger);
            background: transparent;
            border: 1.5px solid #fee2e2;
            color: var(--danger);
        }

        .logout-link:hover {
            background: #fef2f2;
            border-color: var(--danger);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .welcome-container { padding: 40px 24px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-circle" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
    <div class="bg-circle" style="width: 300px; height: 300px; bottom: -50px; right: -50px; background: rgba(118, 75, 162, 0.2);"></div>

    <div class="welcome-container">
        <div class="logo-placeholder">🔥</div>
        <h1>Salut, <span id="userName">Aventurier</span> !</h1>
        <p>
            Ton tableau de bord est prêt. Que souhaites-tu suivre aujourd'hui ?
        </p>
        
        <div class="nav-menu">
            <button onclick="goToAdmin()" id="adminBtn" style="display:none;">
                ⚙️ Dashboard Admin
            </button>

            <button onclick="goToNutrition()" id="nutritionBtn">
                🥗 Nutrition & Repas
            </button>

            <button onclick="goToActivity()" id="activityBtn">
                🏃‍♂️ Activité Physique
            </button>

            <button onclick="logout()" class="logout-link">
                🚪 Déconnexion
            </button>
        </div>
    </div>

<script>
    (function() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (!token || !user) {
            window.location.href = "/trackcalorilog/login";
        }
    })();

    window.onload = () => {
        const userStr = localStorage.getItem('user');
        const user = userStr ? JSON.parse(userStr) : null;

        if (user) {
            // Affiche le prénom personnalisé
            document.getElementById('userName').innerText = user.name.split(' ')[0];
            
            if (user.role.toLowerCase() === 'admin') {
                document.getElementById('adminBtn').style.display = 'flex';
            }
        }
    };

    function logout() {
        if (confirm("Se déconnecter ?")) {
            localStorage.clear(); 
            window.location.href = "/trackcalorilog/login";
        }
    }

    function goToAdmin() {
        const token = localStorage.getItem('token');
        window.location.href = `/admin?token=${token}`;
    }

    function goToNutrition() {
        const token = localStorage.getItem('token');
        window.location.href = `/nutrition?token=${token}`;
    }

    function goToActivity() {
        const token = localStorage.getItem('token');
        window.location.href = `/activity?token=${token}`;
    }
</script>

</body>
</html>
