<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue - TrackCaloriLog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .welcome-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.6s ease;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff4b4b 0%, #d32f2f 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #adminBtn{
            background: linear-gradient(135deg, #034ef0ff 0%, #2558ffff 100%);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 75, 75, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>Bienvenue sur TrackCaloriLog 👋</h1>
        <p>
            Bienvenue dans votre application qui va révolutionner votre manière
            de gérer vos calories, vos dépenses énergétiques et votre bien-être
            au quotidien.
            <br><br>
            Prenez le contrôle de votre santé, un pas à la fois.
        </p>
        <div class="d-flex flex-column align-items-center gap-3">
            <button onclick="window.location.href='/admin'"
            id="adminBtn"
            style="display:none;">
                ⚙️ Dashboard Admin
            </button>

            <button onclick="logout()" class="btn btn-danger px-4">
                🚪 Déconnexion
            </button>
        </div>
    </div>

<script>
    (function() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        // Si pas de token, on n'attend même pas le chargement, on dégage
        if (!token || !user) {
            window.location.href = "/trackcalorilog/login";
        }
    })();
    function logout() {
        // On demande confirmation avant d'agir
        const confirmation = confirm("Es-tu sûr de vouloir te déconnecter ?");

        if (confirmation) {
            // 1. On vide le localStorage uniquement si l'utilisateur a confirmé
            localStorage.clear(); 
            
            // 2. Redirection vers la page de login
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = "/trackcalorilog/login";
        } else {
            // Si l'utilisateur annule, on affiche un petit message en console (optionnel)
            console.log("Déconnexion annulée");
        }
    }
    window.onload = () => {
        const userStr = localStorage.getItem('user');
        const token = localStorage.getItem('token');
        const user = userStr ? JSON.parse(userStr) : null;

        if (!token || !user) {
            window.location.href = "/trackcalorilog/login";
            return;
        }

        // --- LA MAGIE ICI ---
        // Si l'utilisateur est admin, on montre le bouton
        if (user.role.toLowerCase() === 'admin') {
            document.getElementById('adminBtn').style.display = 'inline-block';
        }

        // On peut aussi afficher un message de bienvenue personnalisé
        console.log("Bienvenue sur l'espace user, " + user.name);
    };
</script>

</body>
</html>
